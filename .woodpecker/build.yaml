when:
  - event: push
    branch:
      - "*"
  - event: manual

steps:
  - name: build-binary
    image: golang:1.26
    environment:
      GOCACHE: /woodpecker/cache/go-build
      GOMODCACHE: /woodpecker/cache/go-mod
      GOGC: "off"
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      CC: aarch64-linux-gnu-gcc
    commands:
      - go build -o edh-stats ./cmd/edh-stats
    volumes:
      - /var/lib/woodpecker/cache/go:/woodpecker/cache

  - name: build-docker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: https://registry.wdpkr.home
      repo: registry.wdpkr.home/edh-stats
      tags: latest
      context: .
      dockerfile: Dockerfile
    depends_on:
      - build-binary

  - name: deploy
    image: alpine
    environment:
      SSH_KEY:
        from_secret: deploy_ssh_key
      REGISTRY: 192.168.88.100:5000
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H 192.168.88.141 >> ~/.ssh/known_hosts 2>/dev/null
      - |
        ssh tld94@192.168.88.141 "
          cd ~/edh-stats &&
          docker compose pull edh-stats &&
          docker compose up -d --force-recreate edh-stats
        "
    depends_on:
      - build-docker
    when:
      - event: push
        branch: main