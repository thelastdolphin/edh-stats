when:
  - event: push
    branch:
      - "*"
  - event: manual

steps:
  # Verification, with a cache of its own.
  #
  # The four Go steps used to share /var/lib/woodpecker/cache/go, warmed once so that a
  # toolchain change would not force a cold standard-library build on this host. That
  # sharing became the problem: three runs in a row failed with pkgbits assertion, then
  # flate corruption, then a SIGSEGV inside the compiler, and afterwards the same module
  # archives verified clean on disk (unzip -t: no errors). All three are reads of data that
  # was being written - the signature of overlapping pipelines sharing one cache directory.
  #
  # So each container now keeps its cache to itself: no shared directory, nothing to
  # overlap. The price is a cold build per step (GOFLAGS=-p=1 keeps that serial, and this
  # host is known to fail cold builds only when they run in parallel with other work).
  # Revisit once we know why a warm cache produced corrupted reads here; until then this
  # step is slower on purpose.
  #
  - name: vet-and-test
    image: golang:1.27.3
    environment:
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      GOFLAGS: "-p=1"
    commands:
      # A module cache can go bad; this turns that into one clear error instead of a
      # compiler that crashes inside a random package.
      - go mod verify
      - go vet ./...
      # No -race here on purpose. The deploy host doubles as the CI agent, it is
      # arm64 and its kernel uses a 39-bit virtual address layout, which
      # ThreadSanitizer refuses before a single test runs:
      #   FATAL: ThreadSanitizer: unsupported VMA range
      #   FATAL: Found 39 - Supported 48
      # That is a kernel/runtime limitation, not a failing test. Run `make
      # test-race` on a machine whose kernel the detector supports.
      - go test -count=1 -timeout 60s ./...

  # Static analysis. Both tools are pinned in the Makefile and fetched on demand, so
  # the step runs the same commands a developer runs; the build cache volume keeps
  # govulncheck from recompiling on every push.
  - name: static-analysis
    image: golang:1.27.3
    environment:
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      GOFLAGS: "-p=1"
    commands:
      # A cold cache means the linter would compile everything itself under its own
      # deadline. Compiling first, with the same toolchain, turns that into a queue
      # of cache hits - and fails earlier and more clearly if the code does not build.
      - go build ./...
      - make lint
      - make vulncheck
    depends_on:
      - vet-and-test

  # The binary is compiled here, in a plain container against its own cache. Compiling it inside the image instead
  # (a cold standard-library build inside the plugin's nested dockerd) is what made
  # builds fail on this machine, so that is not done any more.
  #
  # GOGC/GOMAXPROCS come from the original step: the host has four cores and 4 GB,
  # and GC off for a short-lived compiler avoids spending that budget on collection.
  - name: build-binary
    image: golang:1.27.3
    environment:
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      GOFLAGS: "-p=1"
    commands:
      - go build -o edh-stats ./cmd/edh-stats
    depends_on:
      - vet-and-test

  # The end-to-end test: the real binary, started and driven over HTTP. It runs as
  # soon as the binary exists, in parallel with the image build, and it deliberately
  # does not gate the deploy - add "e2e" to the deploy's depends_on to make it a gate.
  - name: e2e
    image: golang:1.27.3
    environment:
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
      GOMAXPROCS: "2"
      CGO_ENABLED: "1"
      GOFLAGS: "-p=1"
    commands:
      - make e2e
    depends_on:
      - build-binary

  # Only assembles the image out of the binary built above: no compiler, no apt, no
  # cache export, nothing heavy on the Pi.
  - name: build-docker
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: https://registry.wdpkr.home
      repo: registry.wdpkr.home/edh-stats
      tags: latest
      context: .
      dockerfile: Dockerfile
      # Target host is arm64. Add linux/amd64 to the list to publish both.
      platforms: linux/arm64
    depends_on:
      - build-binary

  - name: deploy
    image: alpine
    environment:
      SSH_KEY:
        from_secret: deploy_ssh_key
      DEPLOY_HOST: 192.168.88.141
      DEPLOY_USER: tld94
      # Публичный отпечаток host key целевой машины. Это не секрет, поэтому
      # значение хранится прямо здесь. Пересчитать после переустановки хоста:
      #   ssh-keyscan -t ed25519 192.168.88.141 | ssh-keygen -lf -
      DEPLOY_HOST_FINGERPRINT: "SHA256:vpve5vHw5hbJANC8rxJbsB5KWwj99+Jd17+j3C34gao"
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      # Host verification stays enabled: with StrictHostKeyChecking=no the deploy
      # key would be offered to whatever happens to answer on that address. The
      # algorithm overrides are kept only for an older sshd and can be dropped
      # once the host offers an ed25519 host key.
      - |
        cat > ~/.ssh/config <<'EOF'
        Host 192.168.88.141
          HostKeyAlgorithms +ssh-ed25519,ssh-rsa
          PubkeyAcceptedAlgorithms +ssh-ed25519,ssh-rsa
          StrictHostKeyChecking yes
        EOF
      # Verify the host before trusting it, instead of trusting whatever the scan
      # returns. Only the fingerprint needs to be filled in above.
      - |
        ssh-keyscan -H "$DEPLOY_HOST" > /tmp/host_keys 2>/dev/null
        if [ ! -s /tmp/host_keys ]; then
          echo "ERROR: ssh-keyscan returned no host key for $DEPLOY_HOST"
          exit 1
        fi
        ssh-keygen -lf /tmp/host_keys | awk '{print $2}' | sort -u > /tmp/fingerprints
        if [ -z "$DEPLOY_HOST_FINGERPRINT" ]; then
          echo "WARNING: DEPLOY_HOST_FINGERPRINT is empty, trusting ssh-keyscan output (trust on first use)"
        elif grep -qxF "$DEPLOY_HOST_FINGERPRINT" /tmp/fingerprints; then
          echo "host key verified: $DEPLOY_HOST_FINGERPRINT"
        else
          echo "ERROR: host key fingerprint mismatch for $DEPLOY_HOST"
          echo "expected: $DEPLOY_HOST_FINGERPRINT"
          echo "received: $(tr '\n' ' ' < /tmp/fingerprints)"
          exit 1
        fi
        cat /tmp/host_keys >> ~/.ssh/known_hosts
      # The deployment directory on the host is a clone of this repository, so it
      # is checked out to the exact revision whose image was just built: the
      # docker-compose.yml used by the deploy then always matches the running
      # image. data/ is untracked and ignored, so the database is never touched.
      - |
        test -n "${CI_COMMIT_SHA}" || { echo "CI_COMMIT_SHA is empty, refusing to deploy"; exit 1; }
        ssh "$DEPLOY_USER@$DEPLOY_HOST" "
          cd ~/edh-stats &&
          git fetch --prune origin &&
          git checkout --force ${CI_COMMIT_SHA} &&
          git --no-pager log -1 --oneline &&
          docker compose pull edh-stats &&
          docker compose up -d --force-recreate edh-stats
        "
    depends_on:
      - build-docker
    when:
      - event: push
        branch: main
